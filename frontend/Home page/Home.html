<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title> WEB NOTE'S</title>
    <script src="https://cdn.tailwindcss.com?plugins=line-clamp"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="Home.css">
</head>

<body class="text-on-surface">
    <aside
        class="fixed left-0 top-0 h-full flex flex-col p-4 h-screen w-64 border-r border-transparent bg-slate-50 dark:bg-slate-900 z-50">

        <!-- Header -->
        <div class="mb-8 px-4 flex items-center justify-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tighter text-indigo-600 dark:text-indigo-400 text-center">
                    WEB NOTE'S</h1>

            </div>
        </div>

        <!-- New Note Button -->
        <a href="../add new/new.html" onclick="clearEdit()"
            class="mb-8 w-full signature-gradient text-on-primary py-3 px-4 rounded-full font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-all duration-200 active:scale-95">
            <span class="material-symbols-outlined text-lg">add</span>
            New Note
        </a>

        <!-- Navigation -->
        <nav class="flex-1 space-y-1">
            <a class="flex items-center gap-3 px-4 py-2 text-indigo-600 dark:text-indigo-400 font-semibold bg-white/50 dark:bg-slate-800/50 rounded-xl"
                href="#">
                <span class="material-symbols-outlined">description</span>
                <span>All Notes</span>
            </a>
            <a href="../Favorite page/favorite.html" class="flex items-center gap-3 px-4 py-2 text-slate-500 dark:text-slate-400
   hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/50
   dark:hover:bg-slate-700/50 transition-colors duration-200 rounded-xl">
                <span class="material-symbols-outlined">star</span>
                <span>Favorites</span>
            </a>
            <a href="../pinned page/pinned.html" class="flex items-center gap-3 px-4 py-2 text-slate-500 dark:text-slate-400
   hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/50
   dark:hover:bg-slate-700/50 transition-colors duration-200 rounded-xl">
                <span class="material-symbols-outlined">push_pin</span>
                <span>Pinned</span>
            </a>
            <a href="../folder/folder.html"
                class="flex items-center gap-3 px-4 py-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-colors duration-200 rounded-xl">
                <span class="material-symbols-outlined">folder</span>
                <span>Folders</span>
            </a>
        </nav>

        <!-- Profile Section at Bottom -->
        <div class="mt-auto pt-4 border-t border-slate-200/50">
            <div id="profileBtn"
                class="flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-all duration-200 group">
                <div
                    class="w-10 h-10 rounded-full signature-gradient flex items-center justify-center text-white shadow-md">
                    <span class="material-symbols-outlined text-xl">person</span>
                </div>
                <div class="flex-1">
                    <p id="userName" class="text-sm font-semibold text-on-surface">Loading...</p>
                    <p class="text-[10px] text-on-surface-variant">View Profile</p>
                </div>
                <span
                    class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
            </div>
        </div>
    </aside>

    <!-- Profile Dropdown Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 rounded-xl p-6 w-96 max-w-md mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-on-surface">Profile</h3>
                <button id="closeProfileModal" class="text-gray-400 hover:text-gray-600">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="flex items-center gap-4 mb-6">
                <div
                    class="w-16 h-16 rounded-full signature-gradient flex items-center justify-center text-white shadow-md">
                    <span class="material-symbols-outlined text-3xl">person</span>
                </div>
                <div>
                    <p id="modalUserName" class="text-lg font-bold text-on-surface">User Name</p>
                    <p id="modalUserEmail" class="text-sm text-on-surface-variant">user@example.com</p>
                </div>
            </div>

            <div class="border-t border-slate-200 dark:border-slate-700 pt-4">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200">
                    <span class="material-symbols-outlined text-sm">logout</span>
                    Logout
                </button>
            </div>
        </div>
    </div>

    <header
        class="fixed top-0 w-full z-40 flex justify-between items-center h-16 px-8 ml-64 bg-slate-50/70 dark:bg-slate-900/70 backdrop-blur-xl">
        <div class="flex items-center gap-4 flex-1">
            <div class="relative max-w-md w-full">
                <span
                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
                <input id="searchInput"
                    class="w-full bg-surface-container-high border-none focus:ring-2 focus:ring-primary-container rounded-full py-2 pl-10 pr-4 text-sm placeholder:text-on-surface-variant"
                    placeholder="Search your archive..." type="text" />
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-4">
                <button id="theme-toggle"
                    class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors">dark_mode</button>
                <button
                    class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors">notifications</button>
            </div>
        </div>
    </header>

    <main class="ml-64 pt-24 px-12 pb-24 min-h-screen">
        <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Notes will appear here dynamically -->
        </div>
    </main>

    <script src="Home.js"></script>
</body>

</html>
