<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="pinned.css">
</head>

<body class="bg-surface">
    <aside
        class="fixed left-0 top-0 h-full flex flex-col p-4 z-50 h-screen w-64 rounded-r-3xl bg-slate-100/50 dark:bg-slate-950/50 backdrop-blur-3xl font-inter text-sm transition-transform duration-300 ease-in-out">
        <!-- Updated Header - Removed profile icon and changed text -->
        <div class="mb-8 px-4 flex items-center justify-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tighter text-indigo-600 dark:text-indigo-400 text-center">
                    WEB NOTE'S</h1>

            </div>
        </div>
        <nav class="flex-1 space-y-1">

            <!-- Back Button -->
            <a href="../Home page/Home.html"
                class="signature-gradient text-white rounded-xl py-3 px-4 mb-6 flex items-center justify-center gap-2 font-medium">
                <span class="material-symbols-outlined">arrow_back</span>
                Back
            </a>

            <!-- All Notes -->
            <a href="../Home page/Home.html"
                class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-slate-900 hover:bg-slate-200/50 rounded-xl transition-colors">
                <span class="material-symbols-outlined">description</span>
                <span>All Notes</span>
            </a>

            <!-- Favorites -->
            <a href="../Favorite page/favorite.html"
                class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-slate-900 hover:bg-slate-200/50 rounded-xl transition-colors">
                <span class="material-symbols-outlined">star</span>
                <span>Favorites</span>
            </a>

            <!-- Pinned (ACTIVE - This should be highlighted) -->
            <a href="../pinned page/pinned.html"
                class="flex items-center gap-3 px-4 py-2 text-indigo-600 bg-white rounded-xl font-semibold">
                <span class="material-symbols-outlined">push_pin</span>
                <span>Pinned</span>
            </a>

            <!-- Folders -->
            <a href="../folder/folder.html"
                class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-slate-900 hover:bg-slate-200/50 rounded-xl transition-colors">
                <span class="material-symbols-outlined">folder</span>
                <span>Folders</span>
            </a>

        </nav>
    </aside>

    <main class="ml-64 min-h-screen">
        <header
            class="fixed top-0 left-64 right-0 z-40 h-16 flex items-center px-10 bg-slate-50/70 dark:bg-slate-900/70 backdrop-blur-2xl shadow-sm font-inter tracking-tight">
        </header>

        <div class="pt-24 px-10 pb-20 max-w-[1600px] mx-auto">
            <section class="mb-12">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-3xl font-extrabold tracking-tight text-on-surface mb-1">Pinned</h2>
                        <p class="text-on-surface-variant font-medium opacity-70">Critical artifacts and ongoing
                            thoughts.</p>
                    </div>
                    <button
                        class="flex items-center gap-2 text-primary font-bold text-sm uppercase tracking-widest px-4 py-2 hover:bg-primary-container/20 rounded-lg transition-all">
                        Filter by tag <span class="material-symbols-outlined text-lg"
                            data-icon="filter_list">filter_list</span>
                    </button>
                </div>

                <div id="pinnedContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </section>
        </div>
    </main>
    <script src="pinned.js"></script>
</body>

</html>
