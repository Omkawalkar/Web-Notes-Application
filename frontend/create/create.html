<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Create Account |  WEB NOTE'S</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="create.css">
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-black tracking-tighter text-on-surface uppercase">WEB NOTE'S</h1>
            </div>
            <div class="bg-surface-container-lowest rounded-lg p-8 md:p-10 ambient-shadow">
                <div class="mb-8">
                    <h2 class="text-xl font-bold text-on-surface tracking-tight">Create Account</h2>
                    <p class="text-sm text-on-surface-variant">Start your curated collection today.</p>
                </div>
                <form id="registerForm" class="space-y-6">
                    <p id="message"></p>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-surface-variant px-1">Full Name</label>
                        <div class="relative">
                            <input id="name" class="w-full bg-surface-container-high border-none rounded-DEFAULT py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all outline-none" placeholder="Alex Rivera" type="text"/>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-surface-variant px-1">Email Address</label>
                        <div class="relative">
                            <input id="email" class="w-full bg-surface-container-high border-none rounded-DEFAULT py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all outline-none" placeholder="alex@example.com" type="email"/>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-surface-variant px-1">Password</label>
                        <div class="relative">
                            <input id="password"  class="w-full bg-surface-container-high border-none rounded-DEFAULT py-4 px-5 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all outline-none" placeholder="••••••••" type="password"/>
                        </div>
                    </div>
                    <div class="flex items-start gap-3 px-1">
                        <input class="mt-1 w-4 h-4 rounded text-primary focus:ring-primary-container border-outline-variant bg-surface-container-high" id="terms" type="checkbox"/>
                        <label class="text-xs text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <span class="text-primary font-semibold hover:underline cursor-pointer">Terms of Service</span> and <span class="text-primary font-semibold hover:underline cursor-pointer">Privacy Policy</span>.
                        </label>
                    </div>
                    <button class="w-full signature-gradient text-white font-bold py-4 rounded-full ambient-shadow hover:opacity-90 transition-all active:scale-[0.98] mt-4" type="submit">
                        Create Account
                    </button>
                </form>
                <div class="mt-8 text-center">
                    <p class="text-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-slate-50 dark:bg-slate-900 w-full py-8 mt-auto flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-4">
        <div class="text-xs uppercase tracking-widest font-medium text-slate-500 dark:text-slate-400">
            © 2024 Lumina Notes. All rights reserved.
        </div>
        <div class="flex gap-6">
            <a class="text-xs uppercase tracking-widest font-medium text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
            <a class="text-xs uppercase tracking-widest font-medium text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors opacity-80 hover:opacity-100" href="#">Terms of Service</a>
            <a class="text-xs uppercase tracking-widest font-medium text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors opacity-80 hover:opacity-100" href="#">Support</a>
        </div>
    </footer>
    <script src="create.js"></script>
</body>
</html>
